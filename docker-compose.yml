services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: o24_monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - monitor_pgdata:/var/lib/postgresql/data
      - ./web/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d o24_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  monitor_pgdata:
